<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yellow Team Parade</title>
<meta name="theme-color" content="#F5C400">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF9DB;--ink:#2B2A1F;--card:#fff;--line:#E6DC9A;--y:#F5C400;--y2:#B38F00;--muted:#6E6A4E;--bad:#B3322B;--ok:#2F7D4F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1B10;--ink:#F6F0CC;--card:#29261A;--line:#4A4425;--muted:#B7B088}}
:root[data-theme="dark"]{--bg:#1D1B10;--ink:#F6F0CC;--card:#29261A;--line:#4A4425;--muted:#B7B088}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Thai","Leelawadee UI",system-ui,sans-serif}
header{background:var(--y);color:#2B2A1F;padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:1.1rem;margin:0;font-weight:800;flex:1;display:flex;align-items:center;gap:10px}
.live{font-size:.72rem;font-weight:600;display:inline-flex;align-items:center;gap:5px;background:rgba(43,42,31,.1);border-radius:999px;padding:1px 9px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 2s infinite}
.live.off i{background:var(--bad);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:2px solid #2B2A1F;background:transparent;color:#2B2A1F;border-radius:999px;padding:4px 12px;font:inherit;font-weight:600;cursor:pointer;position:relative}
nav button.on{background:#2B2A1F;color:var(--y)}
nav .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:.7rem;padding:0 6px;margin-left:4px;font-weight:800}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.2rem}
label.f{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--y);border-color:var(--y2);color:#2B2A1F;font-weight:600}
:focus-visible{outline:3px solid var(--y2);outline-offset:2px}
.btn{background:var(--y);color:#2B2A1F;border:2px solid #2B2A1F;border-radius:10px;padding:9px 18px;font:inherit;font-weight:800;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.55;cursor:wait}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 12px;margin:4px 4px 0 0;font-size:.85rem}
.w{width:100%}
.err{color:var(--bad);min-height:1.4em;font-size:.9rem}
.hint{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;color:var(--muted);margin-top:10px}
.row{display:flex;gap:12px;align-items:center}
.avatar{width:60px;height:60px;border-radius:50%;background:var(--line);object-fit:cover;display:grid;place-items:center;font-weight:800;flex:none}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.member{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.member:first-of-type{border-top:0}
.info{flex:1;min-width:180px}.info small{color:var(--muted)}
.tag{font-size:.75rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 7px;margin:2px 4px 0 0;display:inline-block}
.role{background:#2B2A1F;color:var(--y);border-radius:5px;padding:1px 6px;font-size:.7rem;margin-left:4px}
.badge{border-radius:5px;padding:1px 8px;font-size:.75rem;font-weight:700;color:#fff;display:inline-block}
.member select{width:auto;max-width:140px;padding:5px}
.empty{color:var(--muted);text-align:center;padding:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2B2A1F;color:var(--y);padding:9px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:20}
.toast.show{opacity:1}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead button{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:2px 10px;font:inherit;cursor:pointer}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid7 .wd{color:var(--muted);font-size:.8rem;padding:4px 0}
.grid7 button.day{aspect-ratio:1;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.grid7 button.day[aria-pressed=true]{background:var(--y);border-color:var(--y2);font-weight:800}
.grid7 button.day.past{opacity:.35}
.grid7 .blank{visibility:hidden}
.result{border-radius:10px;padding:12px;margin-top:10px;font-weight:700}
.result.ok{background:#E4F3E9;color:var(--ok)}
.result.late{background:#FBE5E3;color:var(--bad)}
.note{padding:10px 0;border-top:1px solid var(--line)}
.note:first-of-type{border-top:0}
.note.unread{font-weight:600}
.note.unread::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--y2);margin-right:6px}
.note small{display:block;color:var(--muted);font-weight:400}
.loading{text-align:center;color:var(--muted);padding:40px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>🟡 Yellow Team <span class="live" id="live" hidden><i></i><span>สด</span></span></h1><nav id="nav"></nav></header>
<main id="app"><div class="loading">กำลังโหลด…</div></main>
<div class="toast" id="toast" role="status"></div>
<script>
var SKILLS=["วาดรูป","ใช้กำลัง","งานเหล็ก","ตัด/ขัดโฟม","งานผ้า","ทาสี","งานไฟฟ้า","ตกแต่ง"];
var GROUPS=["ทีมโครงเหล็ก","ทีมโฟม","ทีมผ้า","ทีมทาสี","ทีมไฟฟ้า","ทีมตกแต่ง","ทีมยกของหนัก"];
var MTH=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
var WD=["จ","อ","พ","พฤ","ศ","ส","อา"];
var ROLE_TH={admin:"แอดมิน",leader:"หัวหน้าทีม",member:"สมาชิก"};
var POLL_MS=4000,POLL_HIDDEN_MS=15000;

/* ---------- shared state (filled from the server) ---------- */
var TOKEN_KEY="ytp_token";
var token=localStorage.getItem(TOKEN_KEY);
var settings={photoTask:"",startTime:"15:30",finePerMin:0};
var users=[],me=null,serverToday=null;
var rev=-1,lastNid=0,notes=[],notesLoaded=false,unread=0,syncing=false,syncAgain=false;
var view=token?"loading":"login",dirty=false,pendingDraw=false,saving=0,pollTimer=null,online=true;
var today=new Date();
var calY=today.getFullYear(),calM=today.getMonth();

function pad(n){return n<10?"0"+n:""+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayStr(){return serverToday||ymd(new Date())}
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove("show")},3200)}
function av(u,big){return u.photo?'<img class="avatar" src="'+esc(u.photo)+'" alt=""'+(big?'':' style="width:48px;height:48px"')+'>':'<div class="avatar" style="'+(big?'':'width:48px;height:48px')+'">'+esc((u.name||"?")[0])+'</div>'}
function chips(sel){return '<div class="chips">'+SKILLS.map(function(s){return '<button type="button" class="chip" aria-pressed="'+(sel.indexOf(s)>=0)+'" data-skill="'+s+'">'+s+'</button>'}).join("")+'</div>'}
function statusTh(l){return l.status==="approved"?'<span class="badge" style="background:var(--ok)">อนุมัติแล้ว</span>'+(l.decidedBy?' <small>โดย '+esc(l.decidedBy)+'</small>':''):l.status==="rejected"?'<span class="badge" style="background:var(--bad)">ไม่อนุมัติ</span>'+(l.decidedBy?' <small>โดย '+esc(l.decidedBy)+'</small>':''):'<span class="badge" style="background:var(--y2)">รออนุมัติ</span>'}
function isStaff(){return me&&(me.role==="admin"||me.role==="leader")}
function go(v){view=v;draw();if(v==="notifs"&&unread>0){unread=0;drawNav();api("notifications/read",{}).catch(function(){})}}
function timeAgo(ts){var s=Math.max(0,(Date.now()-new Date(ts).getTime())/1000);if(s<60)return"เมื่อสักครู่";if(s<3600)return Math.floor(s/60)+" นาทีที่แล้ว";if(s<86400)return Math.floor(s/3600)+" ชั่วโมงที่แล้ว";return new Date(ts).toLocaleString("th-TH",{dateStyle:"medium",timeStyle:"short"})}

/* ---------- server API ---------- */
function api(path,body){
return fetch("/api/"+path,{method:body?"POST":"GET",headers:Object.assign({"content-type":"application/json"},token?{authorization:"Bearer "+token}:{}),body:body?JSON.stringify(body):undefined})
.then(function(r){return r.json().catch(function(){return{}}).then(function(d){
if(r.status===401&&token&&path!=="login"){signOut("เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่")}
if(!r.ok)throw new Error(d.error||"เกิดข้อผิดพลาด");return d})})}

// Shrink photos in the browser so uploads are fast on mobile data.
function readImage(file){return new Promise(function(res,rej){if(!file)return res("");
var fr=new FileReader();fr.onerror=function(){rej(new Error("อ่านไฟล์ไม่ได้"))};fr.onload=function(){var img=new Image();
img.onerror=function(){rej(new Error("ไฟล์นี้ไม่ใช่รูปภาพ"))};img.onload=function(){var max=1024,s=Math.min(1,max/Math.max(img.width,img.height));
var c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
res(c.toDataURL("image/jpeg",.82))};img.src=fr.result};fr.readAsDataURL(file)})}

function busy(btn,p){if(btn)btn.disabled=true;saving++;return p.finally(function(){saving--;if(btn)btn.disabled=false})}

/* ---------- real-time sync (polling) ---------- */
function setLive(ok){online=ok;var l=$("live");l.hidden=!token;l.classList.toggle("off",!ok);l.lastChild.textContent=ok?"สด":"ออฟไลน์"}
function schedule(ms){clearTimeout(pollTimer);if(token)pollTimer=setTimeout(sync,ms==null?(document.hidden?POLL_HIDDEN_MS:POLL_MS):ms)}
function sync(){if(!token)return Promise.resolve();
if(syncing){syncAgain=true;return Promise.resolve()}
syncing=true;
return api("sync?rev="+rev+(notesLoaded?"&nid="+lastNid:"")).then(function(d){setLive(true);
if(!token)return;
var initial=!notesLoaded;notesLoaded=true;
if(d.notifications&&d.notifications.length){
if(initial){notes=d.notifications}
else{var fresh=d.notifications.slice().reverse();notes=fresh.concat(notes).slice(0,100);
var latest=fresh[0];toast("🔔 "+latest.message+(fresh.length>1?" (+"+(fresh.length-1)+")":""));
if(document.hidden&&window.Notification&&Notification.permission==="granted"){try{new Notification("Yellow Team",{body:latest.message})}catch(e){}}}
lastNid=Math.max.apply(null,notes.map(function(n){return n.id}).concat([lastNid]))}
if(view==="notifs"&&d.unread){api("notifications/read",{}).catch(function(){});d.unread=0}
unread=d.unread;
if(d.state&&!saving)applyState(d.state);else{drawNav();if(view==="notifs"&&!dirty)draw()}
}).catch(function(e){if(token)setLive(false)}).finally(function(){syncing=false;if(syncAgain){syncAgain=false;sync()}else schedule()})}

function applyState(s){var first=!me;
rev=s.rev;settings=s.settings;users=s.users;serverToday=s.today;
me=users.filter(function(u){return u.id===s.meId})[0]||null;
if(!me){signOut();return}
if(first||view==="loading"){view=me.role==="admin"?"members":"profile";draw();return}
refresh()}

// Re-render with fresh data without clobbering anything the user is typing.
function refresh(){drawNav();
if(view==="members"){listDraw();return}
if(dirty){pendingDraw=true;return}
draw()}

function signOut(msg){var had=!!token;token=null;localStorage.removeItem(TOKEN_KEY);me=null;users=[];rev=-1;lastNid=0;notes=[];notesLoaded=false;unread=0;clearTimeout(pollTimer);setLive(true);view="login";draw();if(msg&&had)toast(msg)}
function signIn(t){token=t;localStorage.setItem(TOKEN_KEY,t);rev=-1;lastNid=0;notes=[];notesLoaded=false;view="loading";draw();setLive(true);
if(window.Notification&&Notification.permission==="default"){try{Notification.requestPermission()}catch(e){}}
return sync()}

/* ---------- views ---------- */
function drawNav(){
if(!me){$("nav").innerHTML="";return}
function b(v,t,extra){return '<button class="'+(view===v?"on":"")+'" data-go="'+v+'">'+t+(extra||"")+'</button>'}
var pend=0;if(isStaff())users.forEach(function(u){if(me.role==="leader"&&u.id===me.id)return;u.leaves.forEach(function(l){if(l.status==="pending")pend++})});
var h=b("profile","โปรไฟล์")+b("avail","ปฏิทิน/ลา")+b("checkin","เช็คชื่อ");
h+=b("notifs","🔔 แจ้งเตือน",unread?'<span class="cnt">'+unread+'</span>':'');
if(isStaff()){h+=b("leaves","อนุมัติการลา",pend?'<span class="cnt">'+pend+'</span>':'');h+=b("attendance",me.role==="admin"?"เช็คชื่อวันนี้":"ทีมวันนี้")}
if(me.role==="admin"){h+=b("members","สมาชิก")+b("settings","ตั้งค่า")}
h+='<button data-go="out">ออกจากระบบ</button>';
$("nav").innerHTML=h}

function draw(){drawNav();dirty=false;pendingDraw=false;var a=$("app");
if(view==="loading"){a.innerHTML='<div class="loading">กำลังโหลด…</div>';return}
if(!me&&view!=="login"&&view!=="register")view="login";
if(view==="login")a.innerHTML=loginH();
else if(view==="register")a.innerHTML=regH();
else if(view==="profile")a.innerHTML=profH();
else if(view==="members")a.innerHTML=memH();
else if(view==="avail")a.innerHTML=availH();
else if(view==="leaves")a.innerHTML=leavesH();
else if(view==="checkin")a.innerHTML=checkinH();
else if(view==="attendance")a.innerHTML=attAdminH();
else if(view==="settings")a.innerHTML=settingsH();
else if(view==="notifs")a.innerHTML=notifsH();
if(view==="members")listDraw()}

function loginH(){return '<div class="card"><h2>เข้าสู่ระบบ</h2>'+
'<label class="f" for="sid">รหัสนักเรียน</label><input type="text" id="sid" inputmode="numeric" autocomplete="username">'+
'<label class="f" for="pin">PIN 6 หลัก</label><input type="password" id="pin" inputmode="numeric" maxlength="6" autocomplete="current-password">'+
'<div class="err" id="err" role="alert"></div><button class="btn w" data-act="login">เข้าสู่ระบบ</button>'+
'<button class="btn sec w" data-go="register">ลงทะเบียนใหม่</button>'+
'</div>'}

function regH(){return '<div class="card"><h2>ลงทะเบียนเข้าทีมสีเหลือง</h2>'+
'<label class="f" for="rs">รหัสนักเรียน</label><input type="text" id="rs" inputmode="numeric">'+
'<label class="f" for="rn">ชื่อ-นามสกุล</label><input type="text" id="rn" placeholder="โชตินภวัน ลือชา">'+
'<label class="f" for="rr">ห้องเรียน</label><input type="text" id="rr" placeholder="ห้อง 4/10">'+
'<label class="f" for="rp">ตั้ง PIN 6 หลัก</label><input type="password" id="rp" inputmode="numeric" maxlength="6" autocomplete="new-password">'+
'<label class="f">ทักษะของคุณ</label>'+chips([])+
'<label class="f" for="ph">รูปโปรไฟล์ (ไม่บังคับ)</label><input type="file" id="ph" accept="image/*">'+
'<div class="err" id="err" role="alert"></div><button class="btn w" data-act="register">ลงทะเบียน</button>'+
'<button class="btn sec w" data-go="login">กลับไปหน้าเข้าสู่ระบบ</button></div>'}

function profH(){return '<div class="card"><div class="row">'+av(me,true)+'<div><h2 style="margin:0">โปรไฟล์ของฉัน</h2><small style="color:var(--muted)">'+esc(me.sid)+' · '+ROLE_TH[me.role]+(me.group?' · '+esc(me.group):' · ยังไม่มีกลุ่ม')+'</small></div></div>'+
(me.room?'':'<div class="hint">กรอกห้องเรียนเพื่อตั้งค่าบัญชีให้เสร็จ</div>')+
'<label class="f" for="pn">ชื่อ-นามสกุล</label><input type="text" id="pn" value="'+esc(me.name)+'">'+
'<label class="f" for="pr">ห้องเรียน</label><input type="text" id="pr" value="'+esc(me.room)+'" placeholder="ห้อง 4/10">'+
'<label class="f">ทักษะ</label>'+chips(me.skills)+
'<label class="f" for="pp">เปลี่ยนรูป</label><input type="file" id="pp" accept="image/*">'+
'<div class="err" id="err" role="alert"></div><button class="btn" data-act="save">บันทึก</button></div>'}

function notifsH(){
var rows=notes.map(function(n){return '<div class="note'+(n.read?'':' unread')+'">'+esc(n.message)+'<small>'+timeAgo(n.createdAt)+'</small></div>'}).join("");
var perm=window.Notification&&Notification.permission==="default"?'<button class="btn sec sm" data-act="enableNotif">เปิดการแจ้งเตือนบนเครื่องนี้</button>':'';
return '<div class="card"><h2>🔔 การแจ้งเตือน</h2><p style="color:var(--muted);font-size:.9rem;margin-top:0">อัปเดตอัตโนมัติทุกไม่กี่วินาที</p>'+perm+(rows||'<p class="empty">ยังไม่มีการแจ้งเตือน</p>')+'</div>'}

/* ---------- calendar ---------- */
function calGrid(){
var first=new Date(calY,calM,1),startOff=(first.getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate();
var cells=[];for(var i=0;i<startOff;i++)cells.push('<span class="blank"></span>');
for(var d=1;d<=dim;d++){var ds=calY+"-"+pad(calM+1)+"-"+pad(d);var isPast=ds<todayStr();
cells.push('<button type="button" class="day'+(isPast?' past':'')+'" data-date="'+ds+'" aria-pressed="'+(me.workdates.indexOf(ds)>=0)+'">'+d+'</button>')}
return '<div class="calhead"><button type="button" data-cal="prev" aria-label="เดือนก่อน">‹</button><b>'+MTH[calM]+' '+(calY+543)+'</b><button type="button" data-cal="next" aria-label="เดือนถัดไป">›</button></div>'+
'<div class="grid7">'+WD.map(function(w){return '<div class="wd">'+w+'</div>'}).join("")+cells.join("")+'</div>'}

function availH(){
var mine=me.leaves.slice().reverse().map(function(l){return '<div class="member"><div class="info"><b>'+esc(l.date)+'</b> '+statusTh(l)+
'<br><small>'+esc(l.reason)+'</small></div>'+(l.photo?'<img src="'+esc(l.photo)+'" alt="หลักฐาน" style="height:50px;border-radius:6px">':'')+'</div>'}).join("")||'<p class="empty">ยังไม่มีคำขอลา</p>';
return '<div class="card"><h2>ปฏิทินวันทำงาน</h2><p style="color:var(--muted);font-size:.9rem">แตะวันที่เพื่อเลือก/ยกเลิก (บันทึกอัตโนมัติ) ต้องเลือกอย่างน้อย 5 วัน</p>'+
calGrid()+'<p style="margin-top:8px">เลือกแล้ว <b>'+me.workdates.length+'</b> วัน</p>'+
'<div class="err" id="errAvail" role="alert"></div><button class="btn" data-act="saveAvail">ยืนยันวันทำงาน</button></div>'+
'<div class="card"><h2>ขอลา (ต้องแนบหลักฐาน)</h2>'+
'<label class="f" for="lvDate">วันที่ลา</label><input type="date" id="lvDate">'+
'<label class="f" for="lvReason">เหตุผล</label><input type="text" id="lvReason" placeholder="เช่น ป่วย มีใบรับรองแพทย์">'+
'<label class="f" for="lvFile">แนบรูปหลักฐาน (ใบรับรองแพทย์ ฯลฯ)</label><input type="file" id="lvFile" accept="image/*">'+
'<div class="err" id="errLeave" role="alert"></div><button class="btn" data-act="sendLeave">ส่งคำขอลา</button>'+
'<p class="hint">คำขอลาจะถูกส่งถึงหัวหน้าทีมและแอดมินทันที และคุณจะได้รับแจ้งเตือนเมื่อมีการอนุมัติ</p>'+
'<h2 style="margin-top:16px">คำขอลาของฉัน</h2>'+mine+'</div>'}

function leavesH(){
var scope=me.role==="admin"?users:users.filter(function(u){return u.id!==me.id});
var items=[];scope.forEach(function(u){u.leaves.forEach(function(l){items.push({u:u,l:l})})});
items.sort(function(a,b){return(a.l.status==="pending"?0:1)-(b.l.status==="pending"?0:1)||b.l.id-a.l.id});
var rows=items.map(function(x){return '<div class="member">'+av(x.u)+'<div class="info"><b>'+esc(x.u.name)+'</b> · '+esc(x.u.group||"ไม่มีกลุ่ม")+
'<br><small>'+esc(x.l.date)+' — '+esc(x.l.reason)+'</small>'+(x.l.photo?'<br><a href="'+esc(x.l.photo)+'" target="_blank" rel="noopener"><img src="'+esc(x.l.photo)+'" alt="หลักฐาน" style="height:60px;border-radius:6px;margin-top:4px"></a>':'<br><small style="color:var(--muted)">ไม่มีไฟล์แนบ</small>')+
'</div><div>'+statusTh(x.l)+(x.l.status==="pending"?'<br><button class="btn sec sm" data-lv="'+x.l.id+':approved">อนุมัติ</button><button class="btn sec sm" data-lv="'+x.l.id+':rejected">ไม่อนุมัติ</button>':'')+'</div></div>'}).join("");
return '<div class="card"><h2>คำขอลาที่ต้องอนุมัติ'+(me.role==="leader"?' · '+esc(me.group||"ไม่มีกลุ่ม"):'')+'</h2>'+(rows||'<p class="empty">ยังไม่มีคำขอลา</p>')+'</div>'}

/* ---------- check-in / fine ---------- */
function checkinH(){
var already=me.attendance.filter(function(a){return a.date===todayStr()})[0];
var hist=me.attendance.slice().reverse().map(function(a){return '<div class="member"><img src="'+esc(a.photo)+'" alt="" style="width:48px;height:48px;border-radius:8px;object-fit:cover">'+
'<div class="info"><b>'+esc(a.date)+'</b> · '+esc(a.time)+'<br><small>'+(a.late>0?'มาสาย '+a.late+' นาที · หัก '+a.fine+' บาท':'ตรงเวลา')+'</small></div></div>'}).join("")||'<p class="empty">ยังไม่มีประวัติ</p>';
return '<div class="card"><h2>เช็คชื่อเข้างานวันนี้ ('+todayStr()+')</h2>'+
'<p>งานที่ต้องถ่ายรูป: <b>'+esc(settings.photoTask)+'</b></p><p style="color:var(--muted);font-size:.9rem">เวลาเข้างาน '+esc(settings.startTime)+' น. · มาสายหักนาทีละ '+settings.finePerMin+' บาท · เวลาอ้างอิงจากเซิร์ฟเวอร์ (เวลาไทย)</p>'+
(already?'<div class="result '+(already.late>0?'late':'ok')+'">เช็คชื่อวันนี้แล้วเวลา '+esc(already.time)+(already.late>0?' — มาสาย '+already.late+' นาที หักเงิน '+already.fine+' บาท':' — ตรงเวลา')+'</div>':
('<label class="f" for="ciFile">แนบรูป: '+esc(settings.photoTask)+'</label><input type="file" id="ciFile" accept="image/*" capture="environment">'+
'<div class="err" id="errCi" role="alert"></div><button class="btn" data-act="doCheckin">เช็คชื่อ</button>'))+
'</div><div class="card"><h2>ประวัติการเช็คชื่อของฉัน</h2>'+hist+'</div>'}

function attAdminH(){
var scope=me.role==="admin"?users:users.filter(function(u){return u.group===me.group});
var inCount=0;
var rows=scope.map(function(u){var a=u.attendance.filter(function(x){return x.date===todayStr()})[0];if(a)inCount++;
var totalFine=u.attendance.reduce(function(s,x){return s+x.fine},0);
var onLeave=u.leaves.some(function(l){return l.date===todayStr()&&l.status==="approved"});
return '<div class="member">'+(a?'<img src="'+esc(a.photo)+'" alt="" style="width:48px;height:48px;border-radius:8px;object-fit:cover">':av(u))+
'<div class="info"><b>'+esc(u.name)+'</b> · '+esc(u.group||"ไม่มีกลุ่ม")+'<br><small>'+(a?(esc(a.time)+(a.late>0?' · มาสาย '+a.late+' นาที':' · ตรงเวลา')):onLeave?'ลาวันนี้ (อนุมัติแล้ว)':'ยังไม่เช็คชื่อวันนี้')+'</small></div>'+
'<div style="text-align:right"><small style="color:var(--muted)">หักเงินสะสม</small><br><b style="color:'+(totalFine>0?'var(--bad)':'var(--ok)')+'">'+totalFine+' บาท</b></div></div>'}).join("");
return '<div class="card"><h2>เช็คชื่อวันนี้ ('+todayStr()+')'+(me.role==="leader"?' · '+esc(me.group):'')+'</h2><p style="color:var(--muted);margin-top:0">มาแล้ว <b>'+inCount+'</b> / '+scope.length+' คน · อัปเดตสด</p>'+(rows||'<p class="empty">ยังไม่มีสมาชิกในทีม</p>')+'</div>'}

function settingsH(){return '<div class="card"><h2>ตั้งค่าการเช็คชื่อ</h2>'+
'<label class="f" for="stTask">โจทย์ถ่ายรูปวันนี้</label><input type="text" id="stTask" value="'+esc(settings.photoTask)+'" placeholder="เช่น ถ่ายรูปคู่กับกระป๋องสี">'+
'<label class="f" for="stTime">เวลาเริ่มงาน</label><input type="time" id="stTime" value="'+esc(settings.startTime)+'">'+
'<label class="f" for="stFine">ค่าปรับต่อนาทีที่สาย (บาท)</label><input type="number" id="stFine" min="0" value="'+settings.finePerMin+'">'+
'<div class="err" id="errSet" role="alert"></div><button class="btn" data-act="saveSettings">บันทึกและประกาศถึงทุกคน</button></div>'}

/* ---------- admin members ---------- */
function memH(){var rooms=[];users.forEach(function(u){if(u.room&&rooms.indexOf(u.room)<0)rooms.push(u.room)});rooms.sort();
function o(t,a){return '<option value="">'+t+'</option>'+a.map(function(x){return '<option>'+esc(x)+'</option>'}).join("")}
return '<div class="card"><h2>สมาชิกทั้งหมด</h2><div class="filters">'+
'<input type="text" id="q" placeholder="ค้นหาชื่อหรือรหัส" aria-label="ค้นหา">'+
'<select id="fr" aria-label="ห้อง">'+o("ทุกห้อง",rooms)+'</select>'+
'<select id="fg" aria-label="กลุ่ม">'+o("ทุกกลุ่ม",GROUPS).replace('</option>','</option><option value="none">ยังไม่มีกลุ่ม</option>')+'</select>'+
'<select id="fs" aria-label="ทักษะ">'+o("ทุกทักษะ",SKILLS)+'</select></div>'+
'<div id="cnt" style="color:var(--muted);font-size:.9rem"></div><div id="list"></div>'+
'<button class="btn sec" data-act="suggest">แนะนำกลุ่มจากทักษะ</button></div>'}

function listDraw(){if(!$("q"))return;var q=($("q").value||"").toLowerCase(),room=$("fr").value,group=$("fg").value,skill=$("fs").value;
var rows=users.filter(function(u){return(!q||(u.name+" "+(u.sid||"")).toLowerCase().indexOf(q)>=0)&&(!room||u.room===room)&&
(!group||(group==="none"?!u.group:u.group===group))&&(!skill||u.skills.indexOf(skill)>=0)});
$("cnt").textContent="แสดง "+rows.length+" จาก "+users.length+" คน";
$("list").innerHTML=rows.length?rows.map(function(u){var tf=u.attendance.reduce(function(s,x){return s+x.fine},0);
return '<div class="member">'+av(u)+'<div class="info"><b>'+esc(u.name)+'</b>'+(u.role!=="member"?'<span class="role">'+ROLE_TH[u.role]+'</span>':'')+'<br><small>'+esc(u.room||"ยังไม่ระบุห้อง")+' · เลือกวันทำงาน '+u.workdates.length+' วัน</small><br>'+
u.skills.map(function(s){return '<span class="tag">'+esc(s)+'</span>'}).join("")+(tf>0?'<br><small style="color:var(--bad)">หักเงินสะสม '+tf+' บาท</small>':'')+'</div>'+
'<select data-mv="'+u.id+'" aria-label="กลุ่มของ '+esc(u.name)+'"><option value="">ไม่มีกลุ่ม</option>'+GROUPS.map(function(g){return '<option'+(g===u.group?' selected':'')+'>'+g+'</option>'}).join("")+'</select></div>'}).join(""):
'<div class="empty">ไม่พบสมาชิก ลองล้างตัวกรอง</div>'}

/* ---------- events ---------- */
function after(msg){return function(){if(msg)toast(msg);return sync()}}
function showErr(id){return function(e){if($(id))$(id).textContent=e.message}}

document.addEventListener("click",function(e){
var t=e.target.closest("button");if(!t)return;
if(t.dataset.skill){t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")!=="true");dirty=true;return}
if(t.dataset.cal){calM+=(t.dataset.cal==="next"?1:-1);if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}draw();return}
if(t.dataset.date){var i=me.workdates.indexOf(t.dataset.date);if(i>=0)me.workdates.splice(i,1);else me.workdates.push(t.dataset.date);draw();
busy(null,api("workdates",{dates:me.workdates.slice()})).then(after()).catch(function(err){toast(err.message);sync()});return}
if(t.dataset.lv){var parts=t.dataset.lv.split(":");
busy(t,api("leaves/"+parts[0],{status:parts[1]})).then(function(d){toast(parts[1]==="approved"?"อนุมัติคำขอลาของ "+d.name+" แล้ว":"ไม่อนุมัติคำขอลาของ "+d.name);return sync()}).catch(function(err){toast(err.message);sync()});return}
if(t.dataset.go){if(t.dataset.go==="out"){api("logout",{}).catch(function(){});signOut();toast("ออกจากระบบแล้ว")}else go(t.dataset.go);return}
var act=t.dataset.act;
function picked(){return[].slice.call(document.querySelectorAll('.chip[aria-pressed="true"]')).map(function(c){return c.dataset.skill})}
if(act==="enableNotif"){Notification.requestPermission().then(function(){draw()});return}
if(act==="login"){busy(t,api("login",{sid:$("sid").value.trim(),pin:$("pin").value})).then(function(d){return signIn(d.token)}).then(function(){if(me)toast("ยินดีต้อนรับ "+me.name)}).catch(showErr("err"))}
if(act==="register"){var pin=$("rp").value;
if(!$("rs").value.trim()||!$("rn").value.trim()||!$("rr").value.trim()){$("err").textContent="กรอกรหัสนักเรียน ชื่อ และห้องเรียนให้ครบ";return}
if(!/^\d{6}$/.test(pin)){$("err").textContent="PIN ต้องเป็นตัวเลข 6 หลัก";return}
var body={sid:$("rs").value.trim(),name:$("rn").value.trim(),room:$("rr").value.trim(),pin:pin,skills:picked()};
busy(t,readImage($("ph").files[0]).then(function(ph){body.photo=ph;return api("register",body)})).then(function(d){return signIn(d.token)}).then(function(){toast("ลงทะเบียนสำเร็จ")}).catch(showErr("err"))}
if(act==="save"){var nm=$("pn").value.trim(),rm=$("pr").value.trim();
if(!nm||!rm){$("err").textContent="ต้องกรอกชื่อและห้องเรียน";return}
var sk=picked();
busy(t,readImage($("pp").files[0]).then(function(ph){return api("profile",{name:nm,room:rm,skills:sk,photo:ph})})).then(function(){dirty=false;return after("บันทึกแล้ว")()}).catch(showErr("err"))}
if(act==="saveAvail"){if(me.workdates.length<5){$("errAvail").textContent="ต้องเลือกอย่างน้อย 5 วัน";return}
$("errAvail").textContent="";toast("บันทึกวันทำงานแล้ว ("+me.workdates.length+" วัน)")}
if(act==="sendLeave"){var dt=$("lvDate").value,rs=$("lvReason").value.trim(),ef=$("lvFile").files[0];
if(!dt||!rs){$("errLeave").textContent="กรอกวันที่และเหตุผล";return}
if(!ef){$("errLeave").textContent="ต้องแนบรูปหลักฐาน เช่น ใบรับรองแพทย์";return}
busy(t,readImage(ef).then(function(ph){return api("leaves",{date:dt,reason:rs,photo:ph})})).then(function(d){dirty=false;
toast("ส่งคำขอลาแล้ว"+(d.notified&&d.notified.length?" แจ้งเตือน "+d.notified.join(", ")+" แล้ว":" แจ้งเตือนแอดมินแล้ว"));rev=-1;return sync()}).catch(showErr("errLeave"))}
if(act==="doCheckin"){var cf=$("ciFile").files[0];if(!cf){$("errCi").textContent="ต้องแนบรูปตามโจทย์ก่อนเช็คชื่อ";return}
busy(t,readImage(cf).then(function(ph){return api("checkin",{photo:ph})})).then(function(d){dirty=false;
toast(d.late>0?"เช็คชื่อสำเร็จ มาสาย "+d.late+" นาที หักเงิน "+d.fine+" บาท":"เช็คชื่อสำเร็จ ตรงเวลา");rev=-1;return sync()}).catch(showErr("errCi"))}
if(act==="saveSettings"){var tk=$("stTask").value.trim(),tm=$("stTime").value,fn=+$("stFine").value;
if(!tk||!tm){$("errSet").textContent="กรอกโจทย์และเวลาให้ครบ";return}
busy(t,api("settings",{photoTask:tk,startTime:tm,finePerMin:fn||0})).then(function(){dirty=false;rev=-1;return after("บันทึกและประกาศถึงทุกคนแล้ว")()}).catch(showErr("errSet"))}
if(act==="suggest"){busy(t,api("suggest",{})).then(function(d){toast(d.count?"จัดกลุ่มให้ "+d.count+" คน แอดมินปรับเองได้":"ทุกคนมีกลุ่มแล้ว");return sync()}).catch(function(err){toast(err.message)})}
});
document.addEventListener("input",function(e){var i=e.target.id;
if(i==="q"||i==="fr"||i==="fg"||i==="fs"){listDraw();return}
if(e.target.dataset.mv!==undefined){var sel=e.target;busy(null,api("members/"+sel.dataset.mv+"/group",{group:sel.value})).then(after("ย้ายกลุ่มแล้ว")).catch(function(err){toast(err.message);sync()});return}
if(e.target.closest("#app"))dirty=true});
document.addEventListener("change",function(e){if(e.target.type==="file")dirty=true});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&token)schedule(0)});
window.addEventListener("online",function(){if(token)schedule(0)});
// A pending redraw (held back while the user was typing) runs once they leave the field.
document.addEventListener("focusout",function(){setTimeout(function(){if(pendingDraw&&!document.querySelector("#app input:focus,#app select:focus")){
var hasFile=[].some.call(document.querySelectorAll('#app input[type=file]'),function(f){return f.files.length});
var typed=[].some.call(document.querySelectorAll('#app input[type=text],#app input[type=date],#app input[type=password]'),function(f){return f.value!==f.defaultValue});
if(!hasFile&&!typed)draw()}},0)});

draw();
if(token)sync();
</script>
</body>
</html>
